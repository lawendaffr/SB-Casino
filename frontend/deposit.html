
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Code - SB-Casino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Urbanist:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/deposit.css">
</head>
<body class="page-deposit">
    <div id="navbar"></div>

    <main class="page-main deposit-page">
        <header class="page-heading">
            <p class="page-eyebrow">PLAYER AREA</p>
            <h1>Redeem credits</h1>
        </header>

        <div class="deposit-layout">
            <section class="panel balance-panel">
                <p class="page-eyebrow">CURRENT BALANCE</p>
                <h2><strong id="balance">Loading...</strong> <small>credits</small></h2>
                <button id="refresh-balance">Refresh Balance</button>
            </section>

            <section class="panel redeem-panel">
                <h2>Enter Your Code</h2>
                <p>Enter a valid credit code to add funds to your balance.</p>

                <form id="redeem-form">
                    <label for="code">Redemption code:</label>
                    <input
                        type="text"
                        id="code"
                        name="code"
                        placeholder="AB12-CD34"
                        maxlength="100"
                        required
                    >
                    <button type="submit" id="redeem-button">
                        Redeem
                    </button>
                </form>

                <p id="redeem-message" role="status"></p>
            </section>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/deposit.js"></script>
</body>
</html>
