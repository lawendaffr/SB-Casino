<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111217">
    <title>SB-Casino — Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Urbanist:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/games.css">
</head>
<body class="games-page page-games">
    <div id="navbar"></div>

    <main class="home-shell">
        <header class="games-heading">
            <div><p class="section-eyebrow">LOBBY</p><h1>Games</h1></div>
            <p class="games-count"><span></span> 1 available <b>/</b> 4 coming soon</p>
        </header>

        <section class="games-section" aria-label="Casino games">
            <div class="game-grid">
                <a class="game-tile game-tile-playable" href="/blackjack">
                    <div class="game-art art-blackjack" aria-hidden="true">
                        <span class="art-glow"></span><span class="art-symbol">21</span><span class="art-suit">♠</span><span class="art-label">BLACKJACK</span>
                    </div>
                    <div class="game-tile-meta"><div><h2>Blackjack</h2><p>Cards</p></div><span class="game-launch" aria-hidden="true">↗</span></div>
                </a>
                <article class="game-tile game-tile-soon"><div class="game-art art-violet" aria-hidden="true"><span class="placeholder-number">02</span><span class="placeholder-status">COMING SOON</span></div><div class="game-tile-meta"><div><h2>Coming soon</h2><p>02</p></div><span class="soon-dot" aria-hidden="true"></span></div></article>
                <article class="game-tile game-tile-soon"><div class="game-art art-coral" aria-hidden="true"><span class="placeholder-number">03</span><span class="placeholder-status">COMING SOON</span></div><div class="game-tile-meta"><div><h2>Coming soon</h2><p>03</p></div><span class="soon-dot" aria-hidden="true"></span></div></article>
                <article class="game-tile game-tile-soon"><div class="game-art art-cyan" aria-hidden="true"><span class="placeholder-number">04</span><span class="placeholder-status">COMING SOON</span></div><div class="game-tile-meta"><div><h2>Coming soon</h2><p>04</p></div><span class="soon-dot" aria-hidden="true"></span></div></article>
                <article class="game-tile game-tile-soon"><div class="game-art art-blue" aria-hidden="true"><span class="placeholder-number">05</span><span class="placeholder-status">COMING SOON</span></div><div class="game-tile-meta"><div><h2>Coming soon</h2><p>05</p></div><span class="soon-dot" aria-hidden="true"></span></div></article>
            </div>
        </section>
    </main>

    <footer class="site-footer"><span>SB-CASINO</span><span>© 2026 SB-Casino. All rights reserved.</span></footer>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
</body>
</html>
