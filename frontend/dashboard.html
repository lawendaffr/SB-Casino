<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SB-Casino</title>
</head>
<body>
    <div id="navbar"></div>

    <main>
        <h1>Dashboard</h1>

        <section>
            <h2>Your Profile</h2>
            <p>User ID: <span id="user-id">Loading...</span></p>
            <p>Username: <span id="username">Loading...</span></p>
            <p>Balance: <span id="balance">Loading...</span> credits</p>
            <button id="refresh-balance">Refresh Balance</button>
        </section>

        <section>
            <h2>Recent Transactions</h2>
            <p id="transactions-message">
                TBD
            </p>
            <ul id="transactions-list"></ul>
        </section>

        <p id="dashboard-message"></p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
