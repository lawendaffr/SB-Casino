<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SB-Casino</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="navbar"></div>

    <main>
        <h1>Dashboard</h1>

        <section>
            <h2>Your Profile</h2>
            <button id="refresh-balance">Refresh Balance</button>
            <p>User ID: <span id="user-id">Loading...</span></p>
            <p>Username: <span id="username">Loading...</span></p>
            <p>Balance: <span class="balance-value"><span id="balance">Loading...</span> credits</span></p>
        </section>


        <section>
            <h2>Recent Activity</h2>

            <button id="refresh-transactions">Refresh</button>
            <p id="transactions-message"></p>

            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="transactions-list"></tbody>
            </table>
        </section>


        <p id="dashboard-message"></p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
