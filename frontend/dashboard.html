<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SB-Casino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Urbanist:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="page-dashboard">
    <div id="navbar"></div>

    <main class="page-main dashboard-page">
        <header class="page-heading">
            <p class="page-eyebrow">PLAYER AREA</p>
            <h1>Dashboard</h1>
        </header>

        <div class="dashboard-grid">
            <section class="panel dashboard-profile">
                <header class="panel-heading"><h2>Your Profile</h2><button id="refresh-balance">Refresh</button></header>
                <dl class="profile-details">
                    <div><dt>User ID</dt><dd id="user-id">Loading...</dd></div>
                    <div><dt>Username</dt><dd id="username">Loading...</dd></div>
                    <div class="profile-balance"><dt>Balance</dt><dd><span id="balance">Loading...</span> <small>credits</small></dd></div>
                </dl>
            </section>

            <section class="panel dashboard-activity">
                <header class="panel-heading"><h2>Recent Activity</h2><button id="refresh-transactions">Refresh</button></header>
                <p id="transactions-message"></p>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Description</th>
                                <th>Date</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-list"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <p id="dashboard-message" class="page-message" role="status"></p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
