
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack - SB-Casino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Urbanist:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/blackjack.css">
</head>
<body class="page-blackjack">
    <div id="navbar"></div>

    <main class="page-main blackjack-page">
        <header class="page-heading">
            <p class="page-eyebrow">TABLE 01</p>
            <h1>Blackjack</h1>
        </header>

        <div class="blackjack-layout">
            <section class="panel bet-panel">
                <h2>Start a Round</h2>
                <p class="balance-line">Your balance <strong><span id="balance">Loading...</span> credits</strong></p>

                <form id="start-form">
                    <label for="bet">Bet:</label>
                    <input
                        type="number"
                        id="bet"
                        min="1"
                        max="1000000"
                        step="1"
                        value="100"
                        required
                    >
                    <button type="submit" id="start-button">Start Game</button>
                </form>
            </section>

            <section class="panel game-panel">
                <h2>Game</h2>
                <p id="game-message">Start a round to play.</p>

                <div class="hand-grid">
                    <div class="hand-card dealer-hand">
                        <h3>Dealer</h3>
                        <div id="dealer-cards" class="card-hand" aria-label="Dealer cards"></div>
                        <p>Total <strong id="dealer-total">-</strong></p>
                    </div>

                    <div class="hand-card player-hand">
                        <h3>You</h3>
                        <div id="player-cards" class="card-hand" aria-label="Your cards"></div>
                        <p>Total <strong id="player-total">-</strong></p>
                    </div>
                </div>

                <div class="game-actions">
                    <button id="hit-button" disabled>Hit</button>
                    <button id="stand-button" disabled>Stand</button>
                </div>

                <div class="round-summary">
                    <p>Bet <strong id="current-bet">-</strong></p>
                    <p>Payout <strong id="payout">-</strong></p>
                    <p>Result <strong id="result">-</strong></p>
                    <p>Balance <strong id="game-balance">-</strong></p>
                </div>
            </section>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/blackjack.js"></script>
</body>
</html>
